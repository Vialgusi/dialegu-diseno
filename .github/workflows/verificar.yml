name: Verificar
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contraste y peso
        run: python scripts/verificar.py
      - name: La versión del paquete coincide con la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import json;print(json.load(open('package.json'))['version'])")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "package.json dice $VERSION y la etiqueta es ${GITHUB_REF_NAME}"; exit 1; }
